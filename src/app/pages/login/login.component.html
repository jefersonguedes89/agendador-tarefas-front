<div class="login-component">
  <mat-card>
    <mat-card-header class="padding-m">
      <mat-card-title>Login</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form">

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Email</mat-label>
          <input
            matInput
            formControlName="email"
            placeholder="Digite o seu email"
          />
          @if (emailErrors) {
          <mat-error>{{ emailErrors }}</mat-error>
          }
        </mat-form-field>
        <password-field [control]="passwordControl"></password-field>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <button
        mat-raised-button
        class="full-width"
        [disabled]="form.invalid || isLoading"
        (click)="submit()"
      >
        <span class="cad-button-content">
          {{ isLoading ? "Entrando..." : "Entrar" }}
          @if(isLoading){<mat-spinner diameter="20"></mat-spinner>}
        </span>
      </button>
    </mat-card-actions>
  </mat-card>
</div>
