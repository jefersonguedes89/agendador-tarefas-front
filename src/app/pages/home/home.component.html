<div class="home-hero">
  <div class="hero-content">
    <div class="hero-text">
      <h1>Organize suas tarefas de forma simples e poderosa</h1>
      <p>
        Tenha mais produtividade e clareza do seu dia a dia com o nosso agendador
        de tarefas inteligente
      </p>
    </div>
    <div class="hero-actions">
      <button mat-raised-button routerLink="/register">Comece Agora</button>
      <button mat-raised-button routerLink="/login">Já tenho conta</button>
    </div>
  </div>
  <div class="hero-image">
    <img [src]="imgHero" />
  </div>
</div>
